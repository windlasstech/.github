name: OSV Scanner Full

on:
  workflow_call:
    inputs:
      scan-args:
        description: "Additional scan arguments, one per line. Do not set --format or --output."
        required: false
        type: string
        default: |-
          --recursive
          ./
      results-file-name:
        description: "SARIF results file name"
        required: false
        type: string
        default: "results.sarif"
      download-artifact:
        description: "Optional artifact name to download before scanning"
        required: false
        type: string
        default: ""
      ref:
        description: "Optional branch, tag, or commit to scan"
        required: false
        type: string
        default: ""
      upload-sarif:
        description: "Upload SARIF to code scanning when available for this repository"
        required: false
        type: boolean
        default: true
      fail-on-vuln:
        description: "Fail when vulnerabilities are found"
        required: false
        type: boolean
        default: true
      checkout-submodules:
        description: "Checkout git submodules"
        required: false
        type: boolean
        default: false
      egress-policy:
        description:
          "StepSecurity harden-runner egress policy (audit or block). Audit is the minimum permitted
          floor; block can fail the job if required endpoints are missing from allowed-endpoints.
          Establish a baseline with audit first."
        required: false
        type: string
        default: "audit"
      allowed-endpoints:
        description:
          "Allowed outbound endpoints for harden-runner, one per line (e.g., api.github.com:443).
          Only takes effect when egress-policy is block."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan-full:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules }}
          ref: ${{ inputs.ref }}

      - name: Download custom artifact if specified
        if: ${{ inputs.download-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.download-artifact }}
          path: ./

      - name: Run scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --output=results.json
            --format=json
            ${{ inputs.scan-args }}

      - name: Build SARIF report
        uses: google/osv-scanner-action/osv-reporter-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --output=${{ inputs.results-file-name }}
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=${{ inputs.fail-on-vuln }}

      - name: Upload SARIF to code scanning
        if: ${{ inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ inputs.results-file-name }}
