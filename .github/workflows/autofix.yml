name: autofix.ci

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.mjs"
      - ".github/workflows/autofix.yml"
      - ".editorconfig"
      - "bun.lock"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.toml"
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.mjs"
      - ".github/workflows/autofix.yml"
      - ".editorconfig"
      - "bun.lock"
      - "package.json"

permissions: {}

jobs:
  autofix:
    name: Format with bun fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: step-security/setup-bun@f6f5dadeac34f70c7828f731569e8d6e8330b8fb # v2.1.3

      - name: Format with bun fmt
        run: bun run format

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
